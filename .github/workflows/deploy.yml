name: Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build static bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Typecheck
        run: npm run lint

      - name: Run unit tests
        run: ./node_modules/.bin/tsx --test src/utils/assetUrl.test.ts src/emulator/hardware/overscan.test.ts src/emulator/hardware/autoCrop.test.ts src/emulator/hardware/amiga.test.ts src/emulator/settingsStorage.test.ts src/emulator/controls/physicalGamepad.test.ts

      - name: Build production bundle
        env:
          # Relative "./" base ensures all assets (JS, CSS, bios, wasm, sounds)
          # resolve inside any subfolder (e.g. /projects/amiga/) without root binding.
          VITE_BASE_PATH: ${{ vars.PAGES_BASE_PATH || './' }}
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: amiga-dist
          path: dist
